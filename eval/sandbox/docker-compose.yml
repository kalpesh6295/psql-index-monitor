services:
  indexdoctor-db:
    build: .
    container_name: indexdoctor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: indexdoctor
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - shared_buffers=512MB
    ports:
      - '5499:5432'
    volumes:
      - ./seed:/seed:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d indexdoctor']
      interval: 2s
      timeout: 2s
      retries: 30
